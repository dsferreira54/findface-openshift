nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

externalDependencies:
  ntlsAddress: "10.32.200.14:3133"
  videoManagerRpcAddress: "10.32.200.14:18811"
  videoStorageUrl: "http://127.0.0.1:18611"

models:
  pvc:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  loader:
    enabled: false
    image:
      repository: registry.access.redhat.com/ubi9/ubi
      tag: "9.5"
      pullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
    args:
      - sleep infinity
    podSecurityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}

extractionApi:
  enabled: true
  replicaCount: 1
  image:
    repository: image-registry.openshift-image-registry.svc:5000/findface-hml/extraction-api-gpu
    tag: ffserver-12.251015
    pullPolicy: IfNotPresent
  args:
    - --config=/etc/findface-extraction-api.ini
  hostNetwork: false
  dnsPolicy: ClusterFirst
  cudaVisibleDevices: "0"
  gpu:
    enabled: true
    count: 1
  service:
    enabled: true
    port: 18701
    headless:
      annotations: {}
      publishNotReadyAddresses: true
    loadBalancer:
      enabled: true
      addressPool: "pool-vlan70"
      annotations: {}
      externalTrafficPolicy: Cluster
      loadBalancerIPs:
        - "10.32.200.42"
  config:
    listenHost: "0.0.0.0"
  cache:
    pvc:
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 2Gi
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "16"
      memory: 32Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  egressIP:
    enabled: true

videoWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: image-registry.openshift-image-registry.svc:5000/findface-hml/video-worker-gpu
    tag: ffserver-12.251015
    pullPolicy: IfNotPresent
  args:
    - --config=/etc/findface-video-worker.yaml
  hostNetwork: false
  dnsPolicy: ClusterFirst
  cudaVisibleDevices: "0"
  gpu:
    enabled: true
    count: 1
  streamer:
    port: 19001
    url: ""
  service:
    port: 19001
    headless:
      annotations: {}
      publishNotReadyAddresses: true
    loadBalancer:
      enabled: true
      addressPool: "pool-vlan70"
      annotations: {}
      externalTrafficPolicy: Cluster
      loadBalancerIPs:
        - "10.32.200.41"
  cache:
    pvc:
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 2Gi
  recorder:
    pvc:
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "16"
      memory: 32Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  egressIP:
    enabled: true

route: #TODO: Consider removing this
  extractionApi:
    enabled: false
    host: ""
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
